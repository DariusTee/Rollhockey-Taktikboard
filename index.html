<script>
    
const FIELD_IMG_SRC = "bilder_webp_Spielzüge_Rollhockey Spielfeld.png"
const canvas = document.getElementById('field');
const ctx = canvas.getContext('2d');
let W, H;
let fieldImg = new Image();
fieldImg.crossOrigin = "anonymous";
let imgLoaded = false;

fieldImg.onload = function() {
  imgLoaded = true;
  // fit to window
  const sidebarWidth = 240;

  const maxH = window.innerHeight - 30;
  const maxW = window.innerWidth - sidebarWidth - 30;
  const scale = Math.min(maxW / fieldImg.width, maxH / fieldImg.height, 1);
  W = Math.round(fieldImg.width * scale);
  H = Math.round(fieldImg.height * scale);
  canvas.width = W;
  canvas.height = H;
  frames = [defaultState()];
  currentFrame = 0;
  renderFrameList();
  renderPlayerBtns();
  draw(frames[0]);
};
function rescaleFrames(oldW, oldH, newW, newH){

    const scaleX = newW / oldW;
    const scaleY = newH / oldH;


    frames.forEach(frame=>{

        frame.players.forEach(p=>{
            p.x *= scaleX;
            p.y *= scaleY;
        });


        frame.ball.x *= scaleX;
        frame.ball.y *= scaleY;


        frame.arrows.forEach(a=>{

            a.x1 *= scaleX;
            a.y1 *= scaleY;

            a.x2 *= scaleX;
            a.y2 *= scaleY;

        });

    });

}
window.addEventListener("resize", ()=>{

    if(!imgLoaded) return;


    const oldW = W;
    const oldH = H;


    const maxH = window.innerHeight - 30;
    const maxW = window.innerWidth - 240 - 30;


    const scale = Math.min(
        maxW / fieldImg.width,
        maxH / fieldImg.height
    );


    W = Math.round(fieldImg.width * scale);
    H = Math.round(fieldImg.height * scale);


    if(oldW && oldH){
        rescaleFrames(oldW, oldH, W, H);
    }


    canvas.width=W;
    canvas.height=H;


    draw(frames[currentFrame]);

});
fieldImg.src = FIELD_IMG_SRC;

let tool = 'select';
let frames = [];
let currentFrame = 0;
let dragTarget = null;
let dragOffX = 0, dragOffY = 0;
let arrowStart = null;
let selectedId = null;
let animTimer = null;

const TEAM_COLORS = {
  A: { field: '#1e40af', gk: '#0ea5e9' },
  B: { field: '#b91c1c', gk: '#f97316' }
};

function mkId() { return Math.random().toString(36).slice(2,8); }

function defaultState() {
  const cx = W/2, cy = H/2;
  return {
    players: [
      { id: mkId(), team: 'A', role: 'gk', x: cx, y: H*0.1, label: 'TW' },
      { id: mkId(), team: 'A', role: 'field', x: cx-W*0.18, y: H*0.25, label: 'A1' },
      { id: mkId(), team: 'A', role: 'field', x: cx, y: H*0.28, label: 'A2' },
      { id: mkId(), team: 'A', role: 'field', x: cx+W*0.18, y: H*0.25, label: 'A3' },
      { id: mkId(), team: 'A', role: 'field', x: cx, y: H*0.42, label: 'A4' },
      { id: mkId(), team: 'B', role: 'gk', x: cx, y: H*0.9, label: 'TW' },
      { id: mkId(), team: 'B', role: 'field', x: cx-W*0.18, y: H*0.75, label: 'B1' },
      { id: mkId(), team: 'B', role: 'field', x: cx, y: H*0.72, label: 'B2' },
      { id: mkId(), team: 'B', role: 'field', x: cx+W*0.18, y: H*0.75, label: 'B3' },
      { id: mkId(), team: 'B', role: 'field', x: cx, y: H*0.58, label: 'B4' },
    ],
    ball: { x: cx, y: cy },
    arrows: []
  };
}

function cloneState(s) { return JSON.parse(JSON.stringify(s)); }

function setTool(t) {
  tool = t;
  arrowStart = null;
  ['select','run','pass','shoot','ball','delete'].forEach(id => {
    const map = { select:'btn-select', run:'btn-run', pass:'btn-pass', shoot:'btn-shoot', ball:'btn-ball', delete:'btn-delete' };
    const el = document.getElementById(map[id]);
    if (el) el.classList.toggle('active', id === t);
  });
  document.getElementById('status').textContent = '';
}

function drawArrow(ctx2, x1, y1, x2, y2, type) {
  const configs = {
    run:   { color: '#22c55e', dash: [8,5], width: 2.5 },
    pass:  { color: '#3b82f6', dash: [],    width: 2.5 },
    shoot: { color: '#ef4444', dash: [4,4], width: 3   }
  };
  const cfg = configs[type] || { color:'#aaa', dash:[], width:2 };
  const dx = x2-x1, dy = y2-y1;
  const len = Math.sqrt(dx*dx+dy*dy);
  if (len < 5) return;
  const ux = dx/len, uy = dy/len;
  const headLen = Math.max(12, len*0.12);
  const angle = Math.atan2(dy, dx);
  ctx2.save();
  ctx2.strokeStyle = cfg.color;
  ctx2.fillStyle = cfg.color;
  ctx2.lineWidth = cfg.width;
  ctx2.setLineDash(cfg.dash);
  ctx2.beginPath();
  ctx2.moveTo(x1, y1);
  ctx2.lineTo(x2 - ux*headLen*0.5, y2 - uy*headLen*0.5);
  ctx2.stroke();
  ctx2.setLineDash([]);
  const a = Math.PI/7;
  ctx2.beginPath();
  ctx2.moveTo(x2, y2);
  ctx2.lineTo(x2-headLen*Math.cos(angle-a), y2-headLen*Math.sin(angle-a));
  ctx2.lineTo(x2-headLen*Math.cos(angle+a), y2-headLen*Math.sin(angle+a));
  ctx2.closePath();
  ctx2.fill();
  ctx2.restore();
}

function drawState(targetCtx, targetCanvas, state) {
  targetCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
  if (imgLoaded) {
    targetCtx.drawImage(fieldImg, 0, 0, targetCanvas.width, targetCanvas.height);
  } else {
    targetCtx.fillStyle = '#4ade80';
    targetCtx.fillRect(0, 0, targetCanvas.width, targetCanvas.height);
  }
  state.arrows.forEach(a => drawArrow(targetCtx, a.x1, a.y1, a.x2, a.y2, a.type));

  // ball
  const b = state.ball;
  const br = Math.max(7, targetCanvas.width * 0.014);
  targetCtx.fillStyle = '#fff';
  targetCtx.strokeStyle = '#111';
  targetCtx.lineWidth = 2;
  targetCtx.beginPath();
  targetCtx.arc(b.x, b.y, br, 0, Math.PI*2);
  targetCtx.fill();
  targetCtx.stroke();
  targetCtx.fillStyle = '#222';
  targetCtx.beginPath();
  targetCtx.arc(b.x-br*0.25, b.y-br*0.25, br*0.32, 0, Math.PI*2);
  targetCtx.fill();

  const pr = Math.max(12, targetCanvas.width * 0.025);
  state.players.forEach(p => {
    const col = p.role === 'gk' ? TEAM_COLORS[p.team].gk : TEAM_COLORS[p.team].field;
    targetCtx.fillStyle = col;
    targetCtx.strokeStyle = selectedId === p.id ? '#fff' : 'rgba(0,0,0,0.6)';
    targetCtx.lineWidth = selectedId === p.id ? 3 : 1.5;
    targetCtx.beginPath();
    if (p.role === 'gk') {
      const s = pr*1.2;
      targetCtx.roundRect(p.x-s, p.y-s, s*2, s*2, 5);
    } else {
      targetCtx.arc(p.x, p.y, pr, 0, Math.PI*2);
    }
    targetCtx.fill();
    targetCtx.stroke();
    targetCtx.fillStyle = '#fff';
    targetCtx.font = `bold ${Math.max(9, pr*0.75)}px system-ui`;
    targetCtx.textAlign = 'center';
    targetCtx.textBaseline = 'middle';
    targetCtx.fillText(p.label, p.x, p.y);
  });
}

function draw(state) { drawState(ctx, canvas, state); }

function getMousePos(e) {
  const r = canvas.getBoundingClientRect();

  let x, y;

  if (e.touches && e.touches.length > 0) {
    x = e.touches[0].clientX;
    y = e.touches[0].clientY;
  } else {
    x = e.clientX;
    y = e.clientY;
  }

  return {
    x: (x - r.left) * (W / r.width),
    y: (y - r.top) * (H / r.height)
  };
}

function hitPlayer(state, mx, my) {
  const r = Math.max(14, W*0.028);
  return state.players.find(p => Math.hypot(p.x-mx, p.y-my) < r);
}
function hitBall(state, mx, my) { return Math.hypot(state.ball.x-mx, state.ball.y-my) < 14; }

  function startDrag(e) {
    e.preventDefault();

    const pos = getMousePos(e);
    const state = frames[currentFrame];


    // Spieler löschen
    if (tool === "delete") {

        const player = hitPlayer(state, pos.x, pos.y);

        if(player){
            state.players = state.players.filter(
                p => p.id !== player.id
            );

            renderPlayerBtns();
            draw(state);
            return;
        }


        // Ball löschen
        // Ball löschen
if(hitBall(state,pos.x,pos.y)){
    state.ball = null;

    draw(state);
    return;
}

    }


    // Ball setzen
    if(tool === "ball"){

        state.ball.x = pos.x;
        state.ball.y = pos.y;

        draw(state);
        return;
    }


    // Pfeil starten
    if(tool === "run" ||
       tool === "pass" ||
       tool === "shoot"){

        arrowStart = pos;

        return;
    }


    // Spieler auswählen / bewegen
    const player = hitPlayer(state,pos.x,pos.y);

    if(player && tool==="select"){

        dragTarget = player;

        dragOffX = pos.x-player.x;
        dragOffY = pos.y-player.y;

        selectedId = player.id;

        draw(state);
        return;
    }


    // Ball bewegen
    if(hitBall(state,pos.x,pos.y) && tool==="select"){

        dragTarget = state.ball;

        dragOffX = pos.x-state.ball.x;
        dragOffY = pos.y-state.ball.y;

        selectedId=null;

        draw(state);
        return;
    }
}


function moveDrag(e) {
  if (!dragTarget) return;

  e.preventDefault();

  const pos = getMousePos(e);

  dragTarget.x = pos.x - dragOffX;
  dragTarget.y = pos.y - dragOffY;

  draw(frames[currentFrame]);
}


function endDrag(e) {

    if(arrowStart){

        const pos = getMousePos(e);
        const state = frames[currentFrame];


        state.arrows.push({

            x1: arrowStart.x,
            y1: arrowStart.y,

            x2: pos.x,
            y2: pos.y,

            type: tool

        });


        arrowStart=null;

        draw(state);
    }


    dragTarget=null;
}

canvas.addEventListener("mousedown", startDrag);
canvas.addEventListener("mousemove", moveDrag);
window.addEventListener("mouseup", endDrag);

canvas.addEventListener("touchstart", startDrag, { passive: false });
canvas.addEventListener("touchmove", moveDrag, {
    passive:false
});
window.addEventListener("touchend", endDrag);

function renderFrameList() {
  const div = document.getElementById('frame-list');
  div.innerHTML='';
  frames.forEach((f,i) => {
    const el = document.createElement('div');
    el.className='frame-thumb'+(i===currentFrame?' cur':'');
    el.textContent=i+1;
    el.onclick=()=>{currentFrame=i;renderFrameList();draw(frames[i]);renderPlayerBtns();};
    div.appendChild(el);
  });
}

function renderPlayerBtns() {
  ['A','B'].forEach(t => {
    const div=document.getElementById(`team-${t==='A'?'a':'b'}-players`);
    div.innerHTML='';
    frames[currentFrame].players.filter(p=>p.team===t).forEach(p=>{
      const b=document.createElement('button');
      b.className='tool-btn';
      const col=p.role==='gk'?TEAM_COLORS[t].gk:TEAM_COLORS[t].field;
      b.style.cssText=`background:${col};color:#fff;border-color:transparent;`;
      b.textContent=p.label+(p.role==='gk'?' (TW)':'');
      b.onclick=()=>{selectedId=p.id;setTool('select');draw(frames[currentFrame]);};
      div.appendChild(b);
    });
  });
}

function addFrame() {
  const newF=cloneState(frames[currentFrame]);
  newF.arrows=[];
  frames.splice(currentFrame+1,0,newF);
  currentFrame++;
  renderFrameList();draw(frames[currentFrame]);renderPlayerBtns();
}

function delFrame() {
  if(frames.length<=1)return;
  frames.splice(currentFrame,1);
  if(currentFrame>=frames.length)currentFrame=frames.length-1;
  renderFrameList();draw(frames[currentFrame]);
}

let animFrame = null;
let playing = false;

function playAnim() {

    if (playing) {
        playing = false;
        cancelAnimationFrame(animFrame);
        document.getElementById("btn-play").textContent = "▶ Play";
        draw(frames[currentFrame]);
        return;
    }

    playing = true;
    document.getElementById("btn-play").textContent = "⏹ Stop";

    const delay = parseInt(document.getElementById("gif-delay").value);
    const steps = parseInt(document.getElementById("interp-steps").value);

    let frameIndex = 0;
    let interpStep = 0;
    let lastTime = 0;

    function animate(time) {

        if (!playing) return;

        if (time - lastTime >= delay / (steps + 1)) {

            lastTime = time;

            if (frameIndex >= frames.length - 1) {

                draw(frames[frames.length - 1]);

                frameIndex = 0;
                interpStep = 0;

            } else {

                if (interpStep === 0) {

                    draw(frames[frameIndex]);

                } else {

                    const t = interpStep / (steps + 1);

                    draw(
                        lerpState(
                            frames[frameIndex],
                            frames[frameIndex + 1],
                            t
                        )
                    );
                }

                interpStep++;

                if (interpStep > steps + 1) {
                    interpStep = 0;
                    frameIndex++;
                }
            }
        }

        animFrame = requestAnimationFrame(animate);
    }

    animFrame = requestAnimationFrame(animate);
}

function exportPNG() {
  const off=document.createElement('canvas');
  off.width=W;off.height=H;
  const ctx2=off.getContext('2d');
  drawState(ctx2,off,frames[currentFrame]);
  const a=document.createElement('a');
  a.download=`rollhockey_frame${currentFrame+1}.png`;
  a.href=off.toDataURL('image/png');
  a.click();
}

function lerpState(s1,s2,t) {
  const out=cloneState(s1);
  out.players=s1.players.map((p,i)=>{
    const p2=s2.players[i];
    return{...p,x:p.x+(p2.x-p.x)*t,y:p.y+(p2.y-p.y)*t};
  });
  out.ball={x:s1.ball.x+(s2.ball.x-s1.ball.x)*t,y:s1.ball.y+(s2.ball.y-s1.ball.y)*t};
  out.arrows=t<0.5?s1.arrows:s2.arrows;
  return out;
}

async function exportGIF() {
  const delay = parseInt(document.getElementById('gif-delay').value);
  const steps = parseInt(document.getElementById('interp-steps').value);
  const prog = document.getElementById('gif-progress');

  prog.style.display = 'block';
  prog.textContent = 'GIF wird erstellt…';

  const off = document.createElement('canvas');
  off.width = W;
  off.height = H;
  const ctx2 = off.getContext('2d');

  const gif = new GIF({
    workers: 2,
    quality: 8,
    width: W,
    height: H,
    workerScript: './gif.worker.js'
  });

  gif.on('progress', p => {
    prog.textContent = `Encoding: ${Math.round(p * 100)}%`;
  });

  gif.on('finished', blob => {
    prog.textContent = '✓ Fertig! Download startet…';

    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'rollhockey_spielzug.gif';
    a.click();

    URL.revokeObjectURL(url);

    setTimeout(() => {
      prog.style.display = 'none';
    }, 3000);
  });

  gif.on('abort', () => {
    prog.textContent = 'GIF Export abgebrochen';
  });

  drawState(ctx2, off, frames[0]);
  gif.addFrame(ctx2, { copy: true, delay });

  for (let i = 0; i < frames.length - 1; i++) {
    const s1 = frames[i];
    const s2 = frames[i + 1];

    for (let step = 1; step <= steps; step++) {
      const t = step / (steps + 1);

      drawState(ctx2, off, lerpState(s1, s2, t));

      gif.addFrame(ctx2, {
        copy: true,
        delay: Math.round(delay / (steps + 1))
      });
    }

    drawState(ctx2, off, s2);

    gif.addFrame(ctx2, {
      copy: true,
      delay
    });
  }

  gif.render();
}

function normalizeFrames(frames){

    return frames.map(frame=>{

        return {

            players: frame.players.map(p=>({
                id:p.id,
                team:p.team,
                role:p.role,
                label:p.label,

                x:p.x / W,
                y:p.y / H
            })),

            ball:{
                x:frame.ball.x / W,
                y:frame.ball.y / H
            },

            arrows:frame.arrows.map(a=>({

                type:a.type,

                x1:a.x1 / W,
                y1:a.y1 / H,

                x2:a.x2 / W,
                y2:a.y2 / H

            }))

        };

    });

}
function denormalizeFrames(frames){

    return frames.map(frame=>{

        return {

            players: frame.players.map(p=>({
                id:p.id,
                team:p.team,
                role:p.role,
                label:p.label,

                x:p.x * W,
                y:p.y * H
            })),

            ball:{
                x:frame.ball.x * W,
                y:frame.ball.y * H
            },

            arrows:frame.arrows.map(a=>({

                type:a.type,

                x1:a.x1 * W,
                y1:a.y1 * H,

                x2:a.x2 * W,
                y2:a.y2 * H

            }))

        };

    });

}
async function saveSpielzug(){

    const name = prompt("Name des Spielzugs:");

    if(!name) return;


    try {

        await firebaseAddDoc(
            firebaseCollection(firebaseDB, "spielzuege"),
            {
                name: name,
                kategorie: "Angriff",
                beschreibung: "",
                preview: "",
                frames: normalizeFrames(frames),
                erstellt: firebaseServerTimestamp()
            }
        );


        alert("Spielzug gespeichert: " + name);

    } catch(error){

        console.error(error);
        alert("Fehler beim Speichern");

    }

}
async function loadSpielzuege(){

    const liste = document.getElementById("spielzug-liste");

    liste.innerHTML="Lade...";

    try{

        const snap = await firebaseGetDocs(
            firebaseCollection(firebaseDB,"spielzuege")
        );


        liste.innerHTML="";


        snap.forEach(doc=>{

            const data = doc.data();


            const btn=document.createElement("button");

            btn.className="tool-btn";

            btn.innerHTML =
            "📋 "+data.name;


            btn.onclick=()=>{

                frames = denormalizeFrames(data.frames);

                currentFrame=0;

                renderFrameList();
                renderPlayerBtns();

                draw(frames[0]);


                alert(
                    "Spielzug geladen: "
                    + data.name
                );

            };


            liste.appendChild(btn);


        });


    }catch(e){

        console.error(e);

        alert("Fehler beim Laden");

    }

}
async function exportChallengeJSON(){

    const title =
        prompt("Name der Challenge:", "Neuer Spielzug");

    if(!title) return;

    const targetFrame =
        parseInt(
            prompt(
                "Welcher Frame ist die Lösung?",
                frames.length - 1
            )
        );

    const tolerance =
        parseInt(
            prompt(
                "Toleranz in Pixel",
                20
            )
        );

    const data = {

        version:1,

        title,

        sport:"rollhockey",

        created:new Date().toISOString(),

        frames: normalizeFrames(frames),

        quiz:{
            type:"drag_players",

            startFrame:0,

            targetFrame,

            movablePlayers:
                frames[0]
                .players
                .filter(p=>p.team==="A")
                .map(p=>p.id),

            ball:true,

            tolerance
        }

    };

    const blob = new Blob(
        [JSON.stringify(data,null,2)],
        {type:"application/json"}
    );

    const url = URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;

    a.download=
        title.replace(/\s+/g,"_")
        +".json";

    a.click();

    URL.revokeObjectURL(url);

}

function addPlayer(team){

    const state = frames[currentFrame];

    const count =
        state.players.filter(p=>p.team===team).length+1;


    state.players.push({

        id:mkId(),

        team:team,

        role:"field",

        x:W/2,

        y:H/2,

        label:team+count

    });


    renderPlayerBtns();
    draw(state);
}
